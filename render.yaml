services:
  - type: web
    name: assessiq
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/scrape_catalog.py --use-fallback
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
